[package]
name = "gcal-widget"
version = "0.1.0"
description = "iOS-style Google Calendar desktop widget for Windows 11"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = ["tray-icon"] }
tauri-plugin-shell = "2.0"
tauri-plugin-notification = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["full"] }
keyring = "3.0"
window-vibrancy = "0.5"
chrono = { version = "0.4", features = ["serde"] }
windows = { version = "0.61", features = ["Win32_Graphics_Dwm", "Win32_Foundation"] }
