<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Calendar</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="card" id="card" data-tauri-drag-region>
    <div class="header" data-tauri-drag-region>
      <span class="header-title" id="header-label">Today</span>
      <div class="header-right">
        <span class="header-date" id="header-date" title="Hover for current time">
          <span class="date-text" id="date-text">—</span>
          <span class="time-text" id="time-text">—</span>
        </span>
        <div class="header-controls">
          <button id="today-btn" class="icon-btn" title="Jump to today" aria-label="Jump to today">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="4" width="18" height="17" rx="2" />
              <line x1="3" y1="9" x2="21" y2="9" />
              <line x1="8" y1="2" x2="8" y2="6" />
              <line x1="16" y1="2" x2="16" y2="6" />
              <circle cx="12" cy="15" r="2" fill="currentColor" stroke="none" />
            </svg>
          </button>
          <button id="theme-btn" class="icon-btn" title="Appearance" aria-label="Appearance">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="9" />
              <circle cx="12" cy="7.5" r="1.3" fill="currentColor" stroke="none" />
              <circle cx="16.2" cy="12" r="1.3" fill="currentColor" stroke="none" />
              <circle cx="12" cy="16.5" r="1.3" fill="currentColor" stroke="none" />
              <circle cx="7.8" cy="12" r="1.3" fill="currentColor" stroke="none" />
            </svg>
          </button>
          <button id="popout-btn" class="icon-btn" title="Pop out (stay on top)" aria-label="Pop out">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M7 17L17 7M17 7H9M17 7V15" />
            </svg>
          </button>
          <button id="close-btn" class="icon-btn" title="Hide (find me in the tray)" aria-label="Hide">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M6 6L18 18M6 18L18 6" />
            </svg>
          </button>
        </div>
      </div>
    </div>

    <div class="theme-popover" id="theme-popover" style="display:none">
      <div class="popover-section">
        <span class="popover-label">Accent</span>
        <div class="swatch-row">
          <button class="swatch" data-accent="#378ADD" style="background:#378ADD" aria-label="Blue"></button>
          <button class="swatch" data-accent="#1D9E75" style="background:#1D9E75" aria-label="Teal"></button>
          <button class="swatch" data-accent="#D85A30" style="background:#D85A30" aria-label="Coral"></button>
          <button class="swatch" data-accent="#D4537E" style="background:#D4537E" aria-label="Pink"></button>
          <button class="swatch" data-accent="#7F77DD" style="background:#7F77DD" aria-label="Purple"></button>
          <button class="swatch" data-accent="#BA7517" style="background:#BA7517" aria-label="Amber"></button>
          <span class="swatch-sep"></span>
          <button class="swatch swatch-custom" id="custom-accent-swatch" aria-label="Custom color" title="Custom color">
            <input type="color" id="custom-accent-input" value="#378ADD" aria-label="Pick custom accent color" />
          </button>
        </div>
      </div>

      <div class="popover-divider"></div>

      <div class="popover-section">
        <span class="popover-label">Theme</span>
        <div class="theme-row" id="theme-row">
          <button class="theme-swatch" data-theme="dark" style="--sw-bg:#1e1e1e" aria-label="Dark"></button>
          <button class="theme-swatch" data-theme="midnight" style="--sw-bg:#0a0e1a" aria-label="Midnight"></button>
          <button class="theme-swatch" data-theme="slate" style="--sw-bg:#282c36" aria-label="Slate"></button>
          <button class="theme-swatch" data-theme="light" style="--sw-bg:#f5f5f7" aria-label="Light"></button>
          <button class="theme-swatch" data-theme="nord" style="--sw-bg:#2e3440" aria-label="Nord"></button>
          <button class="theme-swatch" data-theme="forest" style="--sw-bg:#1b2a20" aria-label="Forest"></button>
          <button class="theme-swatch" data-theme="rose" style="--sw-bg:#2b1c22" aria-label="Rose"></button>
          <button class="theme-swatch" data-theme="paper" style="--sw-bg:#f3ece0" aria-label="Paper"></button>
        </div>
      </div>

      <div class="popover-divider"></div>

      <div class="popover-section">
        <span class="popover-label">Time format</span>
        <div class="segmented" id="format-row">
          <button class="segment" data-format="12h">12h</button>
          <button class="segment" data-format="24h">24h</button>
        </div>
      </div>

      <div class="popover-section">
        <span class="popover-label">Layout</span>
        <div class="segmented" id="density-row">
          <button class="segment" data-density="standard">Standard</button>
          <button class="segment" data-density="compact">Compact</button>
        </div>
      </div>

      <div class="popover-section">
        <span class="popover-label">Widget size</span>
        <div class="segmented" id="widgetsize-row">
          <button class="segment" data-widgetsize="compact">Compact</button>
          <button class="segment" data-widgetsize="standard">Standard</button>
          <button class="segment" data-widgetsize="large">Large</button>
        </div>
      </div>

      <div class="popover-divider"></div>

      <div class="popover-section">
        <div class="slider-row">
          <span class="popover-label">Opacity</span>
          <span class="slider-value" id="opacity-value">65%</span>
        </div>
        <input type="range" id="opacity-slider" class="opacity-slider" min="15" max="100" step="1" value="65" aria-label="Background opacity" />
      </div>
    </div>

    <div class="tabs" id="tabs">
      <button class="tab" data-view="day">Day</button>
      <button class="tab" data-view="week">Week</button>
      <button class="tab" data-view="month">Month</button>
    </div>

    <div id="day-view" class="view-panel">
      <div id="event-list" class="event-list"></div>
      <div id="empty-state" class="empty-state" style="display:none"><p>No events today</p></div>
    </div>

    <div id="week-view" class="view-panel" style="display:none">
      <div class="week-strip" id="week-strip"></div>
      <div class="agenda-divider"></div>
      <div id="week-agenda" class="event-list"></div>
      <div id="week-empty" class="empty-state" style="display:none"><p>No events</p></div>
    </div>

    <div id="month-view" class="view-panel" style="display:none">
      <div class="month-header" id="month-header"></div>
      <div class="year-popover" id="year-popover" style="display:none">
        <div class="year-popover-header">
          <button class="nav-btn" id="year-prev-decade" aria-label="Previous years">‹</button>
          <span class="year-range" id="year-range-label"></span>
          <button class="nav-btn" id="year-next-decade" aria-label="Next years">›</button>
        </div>
        <div class="year-grid" id="year-grid"></div>
      </div>
      <div class="month-grid" id="month-grid"></div>
      <div class="agenda-divider"></div>
      <div id="month-agenda" class="event-list"></div>
      <div id="month-empty" class="empty-state" style="display:none"><p>No events</p></div>
    </div>
  </div>

  <script type="module" src="main.js"></script>
</body>
</html>
