<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Calendar</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="card" id="card" data-tauri-drag-region>
    <div class="header" data-tauri-drag-region>
      <span class="header-title" id="header-label">Today</span>
      <div class="header-right">
        <span class="header-date" id="header-date">—</span>
        <div class="header-controls">
          <button id="theme-btn" class="icon-btn" title="Accent color" aria-label="Accent color">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="9" />
              <circle cx="12" cy="7.5" r="1.3" fill="currentColor" stroke="none" />
              <circle cx="16.2" cy="12" r="1.3" fill="currentColor" stroke="none" />
              <circle cx="12" cy="16.5" r="1.3" fill="currentColor" stroke="none" />
              <circle cx="7.8" cy="12" r="1.3" fill="currentColor" stroke="none" />
            </svg>
          </button>
          <button id="popout-btn" class="icon-btn" title="Pop out (stay on top)" aria-label="Pop out">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M7 17L17 7M17 7H9M17 7V15" />
            </svg>
          </button>
          <button id="close-btn" class="icon-btn" title="Hide (find me in the tray)" aria-label="Hide">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M6 6L18 18M6 18L18 6" />
            </svg>
          </button>
        </div>
      </div>
    </div>

    <div class="theme-popover" id="theme-popover" style="display:none">
      <button class="swatch" data-accent="#378ADD" style="background:#378ADD" aria-label="Blue"></button>
      <button class="swatch" data-accent="#1D9E75" style="background:#1D9E75" aria-label="Teal"></button>
      <button class="swatch" data-accent="#D85A30" style="background:#D85A30" aria-label="Coral"></button>
      <button class="swatch" data-accent="#D4537E" style="background:#D4537E" aria-label="Pink"></button>
      <button class="swatch" data-accent="#7F77DD" style="background:#7F77DD" aria-label="Purple"></button>
      <button class="swatch" data-accent="#BA7517" style="background:#BA7517" aria-label="Amber"></button>
    </div>

    <div class="tabs" id="tabs">
      <button class="tab" data-view="day">Day</button>
      <button class="tab" data-view="week">Week</button>
      <button class="tab" data-view="month">Month</button>
    </div>

    <div id="day-view" class="view-panel">
      <div id="event-list" class="event-list"></div>
      <div id="empty-state" class="empty-state" style="display:none"><p>No events today</p></div>
    </div>

    <div id="week-view" class="view-panel" style="display:none">
      <div class="week-strip" id="week-strip"></div>
      <div class="agenda-divider"></div>
      <div id="week-agenda" class="event-list"></div>
      <div id="week-empty" class="empty-state" style="display:none"><p>No events</p></div>
    </div>

    <div id="month-view" class="view-panel" style="display:none">
      <div class="month-header" id="month-header"></div>
      <div class="month-grid" id="month-grid"></div>
      <div class="agenda-divider"></div>
      <div id="month-agenda" class="event-list"></div>
      <div id="month-empty" class="empty-state" style="display:none"><p>No events</p></div>
    </div>
  </div>

  <script type="module" src="main.js"></script>
</body>
</html>
